services:
  backend:
    environment:
      GROUP_SUBMISSIONS_ENABLED: "true"
      SCHEDULED_JOBS_ENABLED: "true"
      BROWSER_EXTENSION_BUILD_ENABLED: "false"
      WEB_EXT_API_KEY: ""
      WEB_EXT_API_SECRET: ""
    volumes:
      - ./browser-extension:/browser-extension:ro
  cloudflared:
    image: cloudflare/cloudflared:latest
    deploy:
      replicas: ${CF_TUNNEL_REPLICAS:-1}
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TOKEN}
    restart: unless-stopped
