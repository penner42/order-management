map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_origin $extension_origin {
    default '';
    ~^(chrome|moz)-extension:// $http_origin;
}
server {
    listen 5173;
    root /usr/share/nginx/html;
    client_max_body_size 512m;
    # Docker's DNS re-resolves upstreams after individual containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $tracking http://package-tracking:8080;

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_redirect http://backend:8000/ http://localhost:5173/;
    }
    location /tracking/ {
        rewrite ^/tracking/(.*)$ /$1 break;
        proxy_pass $tracking$uri$is_args$args;
        proxy_set_header Host $http_host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $extension_origin always;
        add_header Access-Control-Allow-Headers 'Authorization,Content-Type' always;
        add_header Access-Control-Allow-Methods 'GET,POST,OPTIONS' always;
        if ($request_method = OPTIONS) { return 204; }
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
